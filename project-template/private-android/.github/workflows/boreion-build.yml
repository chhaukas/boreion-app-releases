name: Build and sign Boreion Android artifact
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android versionName, e.g. 1.2.3 or 1.3.0-beta.1"
        required: true
      channel:
        type: choice
        options: [beta, production]
        default: beta
permissions:
  contents: read
# Serializes this private producer; different apps/repos publish independently.
concurrency:
  group: boreion-distribution
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy SDK package "tools" is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate version and channel
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          if [[ "$CHANNEL" == beta ]]; then [[ "$VERSION" == *-beta.* ]]; else [[ "$VERSION" != *-beta.* ]]; fi
      - name: Restore existing signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test, lint and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test lint assembleRelease
      - name: Verify signing identity and package public metadata
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt")
          test -n "$EXPECTED_CERT_SHA256"
          test "${ACTUAL,,}" = "$EXPECTED_CERT_SHA256"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          python3 scripts/prepare-release.py --apk "$APK" --version "$VERSION" --certificate "${ACTUAL,,}"
      - name: Record artifact provenance (private transfer data only)
        id: provenance
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib
          app=json.loads(pathlib.Path('public-bundle/boreion-app.json').read_text())['appId']
          request={'schemaVersion':1,'repositoryId':int(os.environ['GITHUB_REPOSITORY_ID']),'runId':int(os.environ['GITHUB_RUN_ID']),'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'commit':os.environ['GITHUB_SHA'],'actorId':int(os.environ['GITHUB_ACTOR_ID']),'appId':app,'version':os.environ['VERSION'],'channel':os.environ['CHANNEL']}
          pathlib.Path('public-bundle/request.json').write_text(json.dumps(request))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('artifact=boreion--'+app+'--'+os.environ['VERSION']+'--'+os.environ['CHANNEL']+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.provenance.outputs.artifact }}
          path: public-bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
