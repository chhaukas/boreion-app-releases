name: Central publisher safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOREION_CENTRAL_TEMPLATE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy SDK package "tools" is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Real signature verification with disposable local fixture only
        run: |
          docker --host=unix:///var/run/docker.sock pull "$(cat verifier-image.txt)"
          BOREION_TEST_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" BOREION_TEST_ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" python3 tests/central_apk_smoke.py
