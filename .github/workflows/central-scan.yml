name: Discover approved private Android builds
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: central-build-discovery
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'chhaukas/boreion-app-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve configured source repository names without public logging
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          BOREION_SOURCE_POLICY: ${{ secrets.BOREION_SOURCE_POLICY }}
          CENTRAL_ACTOR_ID: ${{ github.actor_id }}
          CENTRAL_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 scripts/central.py scan-plan
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: reader
        with:
          app-id: ${{ vars.BOREION_READER_APP_ID }}
          private-key: ${{ secrets.BOREION_READER_APP_PRIVATE_KEY }}
          owner: chhaukas
          repositories: ${{ steps.policy.outputs.repositories }}
          permission-actions: read
      - name: Poll only approved workflows and dispatch central review
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ steps.reader.outputs.token }}
          BOREION_SOURCE_POLICY: ${{ secrets.BOREION_SOURCE_POLICY }}
          CENTRAL_ACTOR_ID: ${{ github.actor_id }}
          CENTRAL_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 scripts/central.py scan
