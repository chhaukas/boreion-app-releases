name: Import owner-approved Titan Trening 0.19.0-beta.2 (standalone animated fjord running game)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: owner-approved-titan-training-019-beta-2
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'chhaukas/boreion-app-releases' && github.ref == 'refs/heads/main' && github.actor_id == '338504245'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "13114758"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Verify the exact publisher-approved original file in the APK sandbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker --host=unix:///var/run/docker.sock pull "$(cat verifier-image.txt)"
          python3 scripts/import-titan-training-019-beta-2.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-owner-approved-titan-training-019-beta-2
          path: owner-approved-import/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    # Separate, explicitly owner-dispatched import. No App PEM or APK parser here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upload only approved digest-bound bytes and publish the exact empty draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/import-titan-training-019-beta-2.py publish
