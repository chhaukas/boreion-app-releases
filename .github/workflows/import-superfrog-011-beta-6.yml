name: Import owner-approved Superfrog 0.1.1-beta.6 (TV performance and level code menu)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: owner-approved-superfrog-011-beta-6
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'chhaukas/boreion-app-releases' && github.ref == 'refs/heads/main' && github.actor_id == '338504245'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "13114758"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Verify the exact publisher-approved original file in the APK sandbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker --host=unix:///var/run/docker.sock pull "$(cat verifier-image.txt)"
          python3 scripts/import-superfrog-011-beta-6.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-owner-approved-superfrog-011-beta-6
          path: owner-approved-import/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    # Separate, explicitly owner-dispatched import. No App PEM or APK parser here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upload only approved digest-bound bytes and publish the exact empty draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/import-superfrog-011-beta-6.py publish

  public-check:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A fresh runner, no checkout/token/secrets: prove anonymous public delivery.
    permissions: {}
    steps:
      - name: Download APK anonymously and check exact approved bytes
        run: |
          set -euo pipefail
          curl -q --fail --location --proto '=https' --connect-timeout 15 --max-time 120 --retry 2 -H 'Authorization:' -H 'Cookie:' 'https://github.com/chhaukas/boreion-app-releases/releases/download/superfrog/v0.1.1-beta.6/superfrog-0.1.1-beta.6.apk' -o public.apk
          echo 'eebaa0e4c661359ecab2b876d807f9cc966634cd967e79b70353ef076db7d919  public.apk' | sha256sum -c -
          test "$(stat -c '%s' public.apk)" = 15042227
          echo 'Anonymous public APK download verified without GitHub login.'
      - name: Verify Boreion portal discovery after cache refresh
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -q --fail --location --proto '=https' --connect-timeout 10 --max-time 20 -H 'Authorization:' -H 'Cookie:' 'https://apps.boreion.com/apps/superfrog' -o portal.html && grep -Fq '0.1.1-beta.6' portal.html; then
              echo 'Boreion Apps discovers the exact published Superfrog beta.'
              exit 0
            fi
            sleep 15
          done
          echo 'APK publication succeeded, but portal discovery is not verified yet.' >&2
          exit 1
